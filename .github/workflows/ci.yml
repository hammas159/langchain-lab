name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check shared projects tests scripts
          uv run ruff format --check shared projects tests

      - name: Tests
        # CI has no GPU and no ollama, so the `live` mark is deselected here. That is the
        # reason the suite is split: the scoring rules, the JSON repair and the corpus
        # invariants are pure functions, and those are the parts a regression would hide in.
        run: uv run pytest -q -m "not live"
