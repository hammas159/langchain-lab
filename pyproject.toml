[project]
name = "langchain-lab"
version = "0.1.0"
description = "Five LangChain projects built around the failure each one is usually demoed past."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Muhammad Hammas" }]

dependencies = [
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "projects"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The conversation corpus is dialogue and ground truth, one item per line. Wrapping the turns
# to 100 columns would make the transcript unreadable as a transcript, which is the one thing
# a reader needs to do with it. The rule is relaxed here and nowhere else.
"projects/p03_memory_recall/conversation.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: requires a running ollama server (deselect with '-m \"not live\"')",
]
